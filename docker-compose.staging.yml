services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - ".:/var/www/html"
    environment:
      APP_ENV: staging
      CONTAINER_ROLE: app
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - hale-staging-network

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work redis --queue=generations,notifications,default --sleep=3 --tries=3 --timeout=180 --memory=512
    volumes:
      - ".:/var/www/html"
    environment:
      APP_ENV: staging
      CONTAINER_ROLE: queue-worker
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
      mysql:
        condition: service_started
    networks:
      - hale-staging-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ".:/var/www/html:ro"
      - "./docker/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro"
      - "./docker/ssl:/etc/nginx/ssl:ro"
    depends_on:
      - app
    networks:
      - hale-staging-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hale_staging
      MYSQL_USER: hale_staging
      MYSQL_PASSWORD: staging_secret_password
      MYSQL_ROOT_PASSWORD: staging_root_secret
    volumes:
      - "staging-mysql-data:/var/lib/mysql"
      - "./docker/mysql/init:/docker-entrypoint-initdb.d:ro"
    networks:
      - hale-staging-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - "staging-redis-data:/data"
    networks:
      - hale-staging-network

  minio:
    build:
      context: docker/minio
    image: hale-minio:local
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: hale_staging
      MINIO_ROOT_PASSWORD: staging_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "staging-minio-data:/data"
    networks:
      - hale-staging-network

networks:
  hale-staging-network:
    driver: bridge

volumes:
  staging-mysql-data:
  staging-redis-data:
  staging-minio-data:
