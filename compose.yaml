services:
  app:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    restart: unless-stopped
    volumes: [".:/var/www/html"]
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    build: {context: ., dockerfile: docker/php/Dockerfile}
    restart: unless-stopped
    command: php artisan queue:work redis --queue=generations,notifications,default --sleep=3 --tries=3 --timeout=180 --memory=512
    volumes: [".:/var/www/html"]
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
      mysql:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80", "8080:80"]
    volumes: [".:/var/www/html:ro", "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment: {MYSQL_DATABASE: hale, MYSQL_USER: hale, MYSQL_PASSWORD: secret, MYSQL_ROOT_PASSWORD: root-secret}
    ports: ["33060:3306"]
    volumes: ["mysql-data:/var/lib/mysql", "./docker/mysql/init:/docker-entrypoint-initdb.d:ro"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["63790:6379"]

  minio:
    build: {context: docker/minio}
    image: hale-minio:local
    restart: unless-stopped
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: hale, MINIO_ROOT_PASSWORD: hale-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  minio-init:
    build: {context: docker/minio}
    image: hale-minio:local
    entrypoint: /bin/sh /init.sh
    environment: {MINIO_ROOT_USER: hale, MINIO_ROOT_PASSWORD: hale-secret, AWS_BUCKET: hale}
    volumes: ["./docker/scripts/minio-init.sh:/init.sh:ro"]
    depends_on: [minio]

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["8025:8025", "1025:1025"]

volumes:
  mysql-data:
  minio-data:
